# descriptive: find it and understand it
id: courting-landscape-with-flock-and-town
title: Landscape frieze with courting pairs and a flock
description: A long horizontal landscape frieze. At the left a seated woman and a standing man in a plumed hat clasp hands under a tree, each holding a tall staff, with a dog and a grazing flock beside them; across the open middle ground stand six more courting pairs, one woman holding a man by his long hat plume, with a leafy tree behind them; at the right a flock of birds flies over a hilltop town with towers and a wind-blown shrub closes the scene. Streaky clouds above, hatched ground and reclining figures below. Dark brown etched ink on a transparent background.
