id: paired-roses-on-connected-leafy-branch
title: Two roses on one branch with a leafy shoot
description: "Two double roses on a single prickly branch: a fully open bloom at the bottom seen face on, its stamens at the centre, above a pair of serrated leaves; a second bloom higher up to the right seen from the side; and a shoot of five serrated leaflets branching off to the upper left. Fine etched hatching; dark brown ink on a transparent background."
