title: Flowering stem with tubular flowers and paired serrated leaves
description: "A tall upright stem with pairs of broad serrated oval leaves, whorls of tubular two-lipped flowers springing from the leaf axils and a spike of small flowers at the top; the stem is cut square at the foot. Dark brown-black etched line with the cream paper kept as an opaque fill inside the outlines; the ground outside the plant is transparent."
