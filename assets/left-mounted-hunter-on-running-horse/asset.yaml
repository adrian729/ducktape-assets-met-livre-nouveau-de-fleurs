title: Mounted hunter on a galloping horse
description: "A hunter in a hat with one arm flung up rides a horse at full gallop to the left, its legs stretched fore and aft and its tail flying; a thin rod trails from the rider's hand. Cut from the stag hunt frieze, where he rides closest to the stag. Dark brown-black etched line, cream paper kept as an opaque fill inside the outline, transparent ground."
