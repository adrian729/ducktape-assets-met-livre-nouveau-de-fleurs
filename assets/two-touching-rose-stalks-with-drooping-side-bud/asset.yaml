title: Two rose stalks with a drooping bud
description: "Two prickly rose stalks whose stems cross: an open double rose at the top seen face on with a small centre of stamens, a second open rose at the lower right seen from the side, a drooping bud with long pointed sepals at the right, and serrated rose leaves in threes and fives at the left and along the stems. Fine etched hatching; dark brown ink on a transparent background."
