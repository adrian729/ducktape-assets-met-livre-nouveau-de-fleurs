id: clustered-flowers-with-sword-shaped-leaves
title: Narcissus cluster between two sword-shaped leaves
description: "A cluster of five small cupped star flowers of narcissus form opening at the top of two tall folded sword-shaped leaves that cross as they rise; a short second stem at the lower right carries one nodding flower and a single leaf. Dark brown-black etched line with the cream paper kept as an opaque fill inside the outlines; the ground outside the plant is transparent."
