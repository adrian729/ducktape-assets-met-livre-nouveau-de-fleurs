# descriptive: find it and understand it
id: battlefield-frieze-with-contacting-cavalry
title: Battle frieze with charging cavalry
description: "A wide etched landscape band of a battle. At the right a mass of cavalry charges to the left under raised lances and pennants, horses rearing over fallen men; at the left scattered foot soldiers and skirmishing riders fight across open ground; clouds of gun smoke drift above both halves and a tree closes each end. Dark brown-black ink with the cream paper kept as an opaque fill inside the figures and the ground; the sky and everything outside the drawn edge are transparent."
