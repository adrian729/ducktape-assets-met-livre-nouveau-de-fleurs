# descriptive: find it and understand it
id: stag-hunt-with-three-mounted-hunters
title: Stag hunt frieze with three mounted hunters
description: "A wide etched landscape band of a stag hunt running from right to left. A stag leaps left at the left of centre with a hound at its heels; two mounted hunters gallop after it across open ground and a third on a rearing horse in the right foreground raises a long thin rod; two more hounds race between them. Bushes and trees close each end, a town with towers sits on the horizon and layered clouds fill the sky. Dark brown-black ink with the cream paper kept as an opaque fill inside the ground and figures; the sky and the outside of the band are transparent."
