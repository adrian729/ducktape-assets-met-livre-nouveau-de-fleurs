id: nodding-bloom-on-arching-stem
title: Nodding bloom on an arching stem
description: A single bell-shaped bloom with pointed, slightly flared petals hanging downward to the left from the end of a stem that arches over from the right; a dotted centre shows inside the open mouth. Two narrow curving leaves rise from the base of the stem at the lower right. Fine etched hatching; dark brown ink on a transparent background.
