id: sideways-flower-on-bent-stem-with-long-leaves
title: Open flower on a bent stem with long leaves
description: "A single open flower turned to the right at the end of a stem that bends over at the top, its petals flaring and a curled stamen reaching out; from the foot rise five long narrow wavy leaves fanning left and right, and one broad serrated leaf lies at the lower right. Dark brown-black etched line with the cream paper kept as an opaque fill inside the outlines; the ground outside the plant is transparent."
