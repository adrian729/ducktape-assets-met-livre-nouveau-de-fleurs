title: Large double bloom on a curving stem
description: A large double flower head with many ruffled, overlapping petals, turned to the left at the top; the stem arches down to the right, carrying a pair of narrow lance-shaped leaves halfway down and a whorl of deeply lobed leaves at the base. Fine etched hatching; dark brown ink on a transparent background.
