id: courting-pair-with-two-staffs
title: Seated woman and standing man with staffs
description: A woman in a long dress sits at the left holding a tall staff upright in her left hand and takes the hand of a man standing at the right, seen from behind and turned towards her; he wears a plumed hat and a belted doublet and grips a second tall staff with his outstretched right arm, so the two staffs lean outward like a V. Dark brown etched ink on a transparent background.
