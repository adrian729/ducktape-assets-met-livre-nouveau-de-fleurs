id: small-star-flower-on-slender-stem
title: Small star flower on a slender stem
description: "A small star-shaped flower seen from the front at the top of a long slender stem with one joint, and one folded leaf rising on the right from a sheath near the foot. Dark gray-brown ink only: the paper between the strokes is transparent, so the piece is open line work rather than a filled cutout, with a softer edge than the rest of the plate."
