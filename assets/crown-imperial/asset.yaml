id: crown-imperial
title: Crown imperial with drooping bell flowers
description: "A crown imperial: a thick straight stem topped by a tuft of long upright and spreading leaves, beneath which a whorl of large drooping bell-shaped flowers hangs all round the stem with their stamens showing below the petals. The stem is cut square at the foot and the leaf tuft is cut flat at the top. Dark brown-black etched line with the cream paper kept as an opaque fill inside the outlines; the ground outside the plant is transparent."
