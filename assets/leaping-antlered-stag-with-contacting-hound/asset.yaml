title: Leaping stag with a hound at its heels
description: "An antlered stag leaps to the left with its forelegs tucked and its hind legs stretched out behind; beneath the hind legs a hound runs left with its head raised toward the stag's belly and its tail curled up. Cut from the stag hunt frieze. Dark brown-black etched line, cream paper kept as an opaque fill inside the outline, transparent ground."
