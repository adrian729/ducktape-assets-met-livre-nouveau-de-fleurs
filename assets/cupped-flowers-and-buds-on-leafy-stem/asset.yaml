title: Cupped flowers and buds on a tall leafy stem
description: "A tall upright stem with three open five-petalled cup-shaped flowers, two at the top and one at the right, three closed buds, narrow serrated leaves along the stem and a pair of broad serrated leaves at the foot; the stem is cut square at the bottom. Dark brown-black etched line with the cream paper kept as an opaque fill inside the outlines; the ground outside the plant is transparent."
