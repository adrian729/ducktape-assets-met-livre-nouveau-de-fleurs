id: five-tulips-with-broad-curled-leaves
title: Five tulips with broad curled leaves
description: "Five tulips on long stems rising from one foot: two tall closed blooms at the top left and centre, two opening blooms at the left and right and a small bud at the lower right, with three broad curled basal leaves twisting outward. Dark brown-black etched line with the cream paper kept as an opaque fill inside the outlines; the ground outside the plant is transparent."
