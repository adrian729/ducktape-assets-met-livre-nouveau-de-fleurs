id: leafy-tree-on-mound-with-contacting-figures
title: Leafy tree with a walking pair beneath
description: A broad-crowned leafy tree on a thin trunk rising from a hatched bank, with a lower bush at the left; beneath the crown a woman and a man carrying a stick over his shoulder walk to the right, and a dark hatched mound closes the base at the right. Dark brown etched ink on a transparent background.
